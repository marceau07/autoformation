recovery:
  subject: "Récupération de mot de passe"
  greeting: "Bonjour %name%,"
  body: "Vous avez demandé à réinitialiser votre mot de passe. Veuillez cliquer sur le lien ci-dessous pour définir un nouveau mot de passe."
  expiration: "Ce lien est valide jusqu'à %expiration%."
  button: "Réinitialiser le mot de passe"
  closing: "Si vous n'avez pas demandé cela, veuillez nous le faire savoir."
  signature: "Cordialement,\nL'équipe"
  footer: "Ceci est un message automatisé. Veuillez ne pas répondre."
  info: "Un lien de réinitialisation du mot de passe a été envoyé à votre adresse e-mail. Veuillez vérifier votre boîte de réception et suivre les instructions."
  error: "Une erreur s'est produite lors de l'envoi de l'e-mail de réinitialisation du mot de passe. Veuillez réessayer plus tard."
signup:
  subject: "Votre mot de passe a été changé"
  greeting: "Bonjour %name%,"
  body: "Votre mot de passe a été changé avec succès. Si vous n'avez pas effectué ce changement, veuillez nous contacter immédiatement en répondant à cet e-mail."
  button: "Connectons-nous"
  closing: "Si vous avez des questions, n'hésitez pas à nous contacter."
  signature: "Cordialement,\nL'équipe"
  success: "Votre mot de passe a été changé avec succès."
  error: "Une erreur s'est produite lors de la tentative de changement de mot de passe. Veuillez réessayer."