  - title: "2 - Propriété intellectuelle et contrefaçons"
    content: |
      RODRIGUES Marceau est propriétaire des droits de propriété intellectuelle et détient les droits d'usage sur tous les éléments accessibles sur le site internet, notamment les textes, images, graphismes, logos, vidéos, architecture, icônes et sons.

      Toute reproduction, représentation, modification, publication, adaptation de tout ou partie des éléments du site, quel que soit le moyen ou le procédé utilisé, est interdite, sauf autorisation écrite préalable de RODRIGUES Marceau.

      Toute exploitation non autorisée du site ou de l'un quelconque des éléments qu'il contient sera considérée comme constitutive d'une contrefaçon et poursuivie conformément aux dispositions des articles L.335-2 et suivants du Code de Propriété Intellectuelle.
  - title: "3 - Limitations de responsabilité"
    content: |
      RODRIGUES Marceau ne pourra être tenu pour responsable des dommages directs et indirects causés au matériel de l'utilisateur, lors de l'accès au site <a href="https://%serverName%">https://%serverName%</a>.

      RODRIGUES Marceau décline toute responsabilité quant à l'utilisation qui pourrait être faite des informations et contenus présents sur <a href="https://%serverName%">https://%serverName%</a>.

      RODRIGUES Marceau s'engage à sécuriser au mieux le site <a href="https://%serverName%">https://%serverName%</a>, cependant sa responsabilité ne pourra être mise en cause si des données indésirables sont importées et installées sur son site à son insu.

      Des espaces interactifs (espace contact ou commentaires) sont à la disposition des utilisateurs. RODRIGUES Marceau se réserve le droit de supprimer, sans mise en demeure préalable, tout contenu déposé dans cet espace qui contreviendrait à la législation applicable en France, en particulier aux dispositions relatives à la protection des données.

      Le cas échéant, RODRIGUES Marceau se réserve également la possibilité de mettre en cause la responsabilité civile et/ou pénale de l'utilisateur, notamment en cas de message à caractère raciste, injurieux, diffamant, ou pornographique, quel que soit le support utilisé (texte, photographie …).
  - title: "4 - CNIL et gestion des données personnelles"
    content: |
      Conformément aux dispositions de la loi 78-17 du 6 janvier 1978 modifiée, l'utilisateur du site  dispose d'un droit d'accès, de modification et de suppression des informations collectées. Pour exercer ce droit, envoyez un message à notre Délégué à la Protection des Données : RODRIGUES Marceau - contact@marceau-rodrigues.fr.

      Pour plus d'informations sur la façon dont nous traitons vos données (type de données, finalité, destinataire...), lisez notre <a href="%path%">Politique de confidentialité</a>.
  - title: "5 - Liens hypertextes et cookies"
    content: |
      Le site <a href="https://%serverName%">https://%serverName%</a> contient des liens hypertextes vers d'autres sites et dégage toute responsabilité à propos de ces liens externes ou des liens créés par d'autres sites vers <a href="https://%serverName%">https://%serverName%</a>.

          La navigation sur le site <a href="https://%serverName%">https://%serverName%</a> est susceptible de provoquer l'installation de cookie(s) sur l'ordinateur de l'utilisateur.

          Un "cookie" est un fichier de petite taille qui enregistre des informations relatives à la navigation d'un utilisateur sur un site. Les données ainsi obtenues permettent d'obtenir des mesures de fréquentation, par exemple.

          Vous avez la possibilité d'accepter ou de refuser les cookies en modifiant les paramètres de votre navigateur. Aucun cookie ne sera déposé sans votre consentement.

          Les cookies sont enregistrés pour une durée maximale de mois.

          Pour plus d'informations sur la façon dont nous faisons usage des cookies, lisez notre <a href="%path%">Politique de confidentialité</a>.
  - title: "6 - Droit applicable et attribution de juridiction"
    content: |
      Tout litige en relation avec l'utilisation du site <a href="https://%serverName%">https://%serverName%</a> est soumis au droit français. En dehors des cas où la loi ne le permet pas, il est fait attribution exclusive de juridiction aux tribunaux compétents de Montpellier.