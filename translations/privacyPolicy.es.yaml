title: "Política de privacidad"
h1: "Política de privacidad del sitio web %serverName%"
articles:
  - title: "Política de privacidad"
    content: |
      El sitio web de la Plataforma Educativa es propiedad de Marceau Rodrigues, responsable del tratamiento de sus datos personales.

      Hemos adoptado esta Política de Privacidad, que describe cómo procesamos la información recopilada por Marceau Rodrigues y explica los motivos por los que recopilamos ciertos datos personales sobre usted. Por lo tanto, le recomendamos leer esta Política de Privacidad antes de utilizar el sitio web de Marceau Rodrigues.

      Cuidamos sus datos personales y nos comprometemos a garantizar su confidencialidad y seguridad.
  - title: "Información personal que recopilamos:"
    content: |
      Cuando visita Marceau Rodrigues, recopilamos automáticamente cierta información sobre su dispositivo, incluyendo información sobre su navegador web, dirección IP, zona horaria y algunas cookies instaladas en su dispositivo. Además, mientras navega por el Sitio, recopilamos información sobre las páginas web o productos que visita, los sitios web o términos de búsqueda que lo redireccionaron al Sitio e información sobre cómo interactúa con él. A esta información recopilada automáticamente la denominamos "Información del Dispositivo". Asimismo, podemos recopilar los datos personales que nos proporciona (incluyendo, entre otros, nombre y apellidos, dirección, información de pago, etc.) durante el registro para ejecutar el contrato.
  - title: "¿Por qué procesamos sus datos?"
    content: |
      Nuestra máxima prioridad es la seguridad de los datos de nuestros clientes, por lo que solo procesamos los datos mínimos de los usuarios en la medida absolutamente necesaria para el mantenimiento del sitio web. La información recopilada automáticamente se utiliza únicamente para identificar posibles casos de abuso y para recopilar información estadística sobre el uso del sitio web. Esta información estadística no se agrega de forma que pueda identificar a un usuario específico del sistema. Puede visitar el sitio web sin revelar su identidad ni revelar información que permita identificarle como persona específica e identificable. Sin embargo, si desea utilizar ciertas funciones del sitio web, recibir nuestro boletín informativo o proporcionar otros datos rellenando un formulario, puede proporcionarnos datos personales, como su dirección de correo electrónico, nombre, apellidos, ciudad de residencia, organización y número de teléfono. Si bien puede optar por no proporcionarnos sus datos personales, es posible que no pueda disfrutar de ciertas funciones del sitio web. Por ejemplo, no podrá recibir nuestro boletín informativo ni contactarnos directamente desde el sitio web. Los usuarios que no estén seguros de qué información se requiere deben comunicarse con nosotros a contact@marceau-rodrigues.fr.
  - title: "Sus derechos:"
    content: |
      Si reside en Europa, tiene los siguientes derechos en relación con sus datos personales:

      Derecho a la información.
      Derecho de acceso.
      Derecho de rectificación.
      Derecho de supresión.
      Derecho a la limitación del tratamiento.
      Derecho a la portabilidad de los datos.
      Derecho de oposición.
      Derechos relacionados con la toma de decisiones automatizada y la elaboración de perfiles.
      Si desea ejercer este derecho, póngase en contacto con nosotros utilizando los datos que figuran a continuación. Además, si reside en Europa, le informamos que tratamos su información para cumplir los contratos que podamos tener con usted (por ejemplo, si realiza un pedido a través del Sitio) o para perseguir nuestros intereses comerciales legítimos mencionados anteriormente. Además, tenga en cuenta que su información podría transferirse fuera de Europa, incluyendo a Canadá y Estados Unidos.
  - title: "Enlaces a otros sitios web:"
    content: |
      Nuestro sitio web puede contener enlaces a otros sitios web que no son de nuestra propiedad ni están bajo nuestro control. Tenga en cuenta que no nos responsabilizamos de estos sitios web ni de las prácticas de privacidad de terceros. Le recomendamos que esté atento al salir de nuestro sitio web y que lea las declaraciones de privacidad de todos los sitios web que puedan recopilar información personal.
  - title: "Seguridad de la información:"
    content: |
      Protegemos la información que nos proporciona en servidores informáticos en un entorno controlado y seguro, protegido contra accesos, usos y divulgaciones no autorizados. Mantenemos medidas de seguridad administrativas, técnicas y físicas razonables para proteger contra el acceso, uso, modificación y divulgación no autorizados de los datos personales bajo su control y custodia. Sin embargo, no se puede garantizar la transmisión de datos a través de internet ni de ninguna red inalámbrica.
  - title: "Divulgación legal:"
    content: |
      Revelaremos cualquier información que recopilemos, usemos o recibamos si la ley lo requiere o lo permite, como para cumplir con una citación o un proceso legal similar, y cuando creamos de buena fe que la divulgación es necesaria para proteger nuestros derechos, su seguridad o la seguridad de otros, investigar fraude o responder a una solicitud del gobierno.
  - title: "Información de contacto:"
    content: |
      Si desea contactarnos para comprender mejor esta política o si desea contactarnos con respecto a cualquier asunto relacionado con los derechos individuales y su información personal, puede enviar un correo electrónico a contact@marceau-rodrigues.fr.