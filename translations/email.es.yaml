recovery:
  subject: "Recuperación de contraseña"
  greeting: "Hola %name%,"
  body: "Has solicitado restablecer tu contraseña. Por favor, haz clic en el enlace de abajo para establecer una nueva contraseña."
  expiration: "Este enlace es válido hasta %expiration%."
  button: "Restablecer contraseña"
  closing: "Si no solicitaste esto, háznoslo saber."
  signature: "Saludos cordiales,\nEl equipo"
  footer: "Este es un mensaje automatizado. Por favor, no respondas."
  info: "Se ha enviado un enlace para restablecer la contraseña a tu dirección de correo electrónico. Por favor, revisa tu bandeja de entrada y sigue las instrucciones."
  error: "Ocurrió un error al enviar el correo electrónico de restablecimiento de contraseña. Por favor, inténtalo de nuevo más tarde."
signup:
  subject: "Tu contraseña ha sido cambiada"
  greeting: "Hola %name%,"
  body: "Tu contraseña ha sido cambiada con éxito. Si no realizaste este cambio, por favor contáctanos de inmediato respondiendo a este correo electrónico."
  button: "Conectemos"
  closing: "Si tienes alguna pregunta, no dudes en contactarnos."
  signature: "Saludos cordiales,\nEl equipo"
  success: "Tu contraseña ha sido cambiada con éxito."
  error: "Ocurrió un error al intentar cambiar la contraseña. Por favor, inténtalo de nuevo."