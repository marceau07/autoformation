recovery:
  subject: "Password Recovery"
  greeting: "Hello %name%,"
  body: "You have requested to reset your password. Please click the link below to set a new password."
  expiration: "This link is valid until %expiration%."
  button: "Reset Password"
  closing: "If you did not request this, please let us know."
  signature: "Best regards,\nThe Team"
  footer: "This is an automated message. Please do not reply."
  info: "A password reset link has been sent to your email address. Please check your inbox and follow the instructions."
  error: "An error occurred while sending the password reset email. Please try again later."
signup:
  subject: "Your password has been changed"
  greeting: "Hello %name%,"
  body: "Your password has been successfully changed. If you did not make this change, please contact us immediately by replying to this email."
  button: "Let's connect"
  closing: "If you have any questions, feel free to reach out."
  signature: "Best regards,\nThe Team"
  success: "Your password has been successfully changed."
  error: "An error occurred while attempting to change the password. Please try again."